<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מרדף משטרה צבאית</title>
<style>
html,body{margin:0;height:100%;background:#10151c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#mute{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.45);font-size:22px;color:#fff;cursor:pointer}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,20,.82);color:#fff;text-align:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
#ov h1{margin:0 0 8px;font-size:clamp(28px,7vw,52px);color:#ff4a4a}
#ov p{margin:6px 0;font-size:clamp(14px,3.6vw,20px);line-height:1.5;max-width:520px}
#ov button{margin-top:18px;padding:14px 44px;font-size:22px;font-weight:700;border:0;border-radius:14px;background:#d62828;color:#fff;cursor:pointer}
.hide{display:none!important}
#ov{overflow-y:auto;justify-content:flex-start;touch-action:pan-y}#ov h1{margin-top:auto}#ov #go{margin-bottom:auto}
#ov button.sec{background:#2b6cb0;font-size:17px;padding:10px 26px;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="סאונד">🔊</button>
<div id="ov">
  <h1>🚓 מרדף משטרה צבאית</h1>
  <p id="msg">חשוד ברח מהבסיס! רוץ אחריו, אסוף ראיות (נשקים וסמים) ותפוס אותו לפני שיברח.</p>
  <p>👆 החלקה למעלה: קפיצה &nbsp;|&nbsp; 👇 החלקה למטה: גלישה<br>👈👉 החלקה לצדדים: החלפת נתיב</p>
  <p>(במחשב: מקשי החצים או WASD)</p>
  <p id="best"></p>
  <input id="nm" maxlength="12" placeholder="השם שלך לטבלת השיאים" style="margin-top:8px;padding:10px 14px;font-size:17px;border-radius:10px;border:0;text-align:center;width:min(260px,70vw)">
  <div id="board"></div>
  <button id="sh" class="sec hide">📤 שתף את השיא</button>
  <button id="go">התחל</button>
</div>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),msg=document.getElementById('msg'),bestEl=document.getElementById('best');
let W,H,hz,gy,LW,dpr;
function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);hz=H*.3;gy=H*.88;LW=Math.min(W*.27,H*.17)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem('mpbest')||0}catch(e){}
function saveBest(v){best=v;try{localStorage.setItem('mpbest',String(v))}catch(e){}}
const P=d=>1/(1+d/9),Y=d=>hz+(gy-hz)*P(d),X=(l,d)=>W/2+l*LW*P(d);
let S,running=false,last=0;
function reset(){S={t:0,dist:0,score:0,ev:0,hearts:3,lane:0,px:0,jy:0,vy:0,slide:0,inv:0,gap:17,sl:0,sx:0,stT:2,objs:[],spawn:20,catches:0,flash:0,ph:0,pop:[],buf:0,parts:[],drop:1.2,allDone:false,cnt:Object.fromEntries(ITEMS.map(k=>[k,0]))}}
function spawnPattern(){
  const L=Math.floor(Math.random()*3)-1,r=Math.random(),d0=75,hard=Math.min(S.t/60,1);
  const other=()=>{let o=L;while(o===L)o=Math.floor(Math.random()*3)-1;return o};
  const k=r<.3?'low':r<.6?'high':'block',th=k==='low'?.4:k==='high'?.5:.3;
  S.objs.push({d:d0,l:L,k});if(hard>th)S.objs.push({d:d0,l:other(),k});
}

    ctx.moveTo(W/2-rw*LW*P(b),Y(b));ctx.lineTo(W/2+rw*LW*P(b),Y(b));ctx.lineTo(W/2+rw*LW*P(a),Y(a));ctx.lineTo(W/2-rw*LW*P(a),Y(a));ctx.fill()}
  ctx.strokeStyle='#c1121f';ctx.lineWidth=3;for(const l of[-1.65,1.65]){ctx.beginPath();ctx.moveTo(X(l,70),Y(70));ctx.lineTo(X(l,-3),Y(-3));ctx.stroke()}ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;for(const l of[-.5,.5]){ctx.beginPath();ctx.moveTo(X(l,70),Y(70));ctx.lineTo(X(l,-3),Y(-3));ctx.stroke()}
  const dr=[];for(const o of S.objs)if(!o.got)dr.push({d:o.d,f:()=>drawObj(o)});
  const po=S.dist%12;for(let i=0;i<7;i++){const d=i*12-po;if(d<-2)continue;for(const sd of[-2.3,2.3])dr.push({d,f:()=>{const p=P(d),x=X(sd,d),g=Y(d),u=LW*p;ctx.fillStyle='#444';ctx.fillRect(x-.04*u,g-1.8*u,.08*u,1.8*u);ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(x,g-1.8*u,.1*u,0,7);ctx.fill()}})}
  const sg=S.gap,sy=Math.sin(S.ph*1.3);
  dr.push({d:sg,f:()=>{const p=P(sg),x=X(S.sx,sg),g=Y(sg);if(!villain(x,g,LW*1.55*p,S.ph*1.3,(S.sl-S.sx)*.1))char(x,g,LW*1.35*p,'#a14b2b','#222',S.ph*1.3,0,0,1)}});
  dr.sort((a,b)=>b.d-a.d);for(const e of dr)e.f();
  const blink=S.inv>0&&Math.floor(S.t*14)%2;
  if(!blink)drawPlayer();
  else{ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(X(S.px,0),gy,LW*.3,LW*.07,0,0,7);ctx.fill()}
  for(const q of S.parts){ctx.globalAlpha=Math.max(0,q.a);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  // HUD
  ctx.textBaseline='top';ctx.textAlign='right';ctx.fillStyle='#fff';const f=Math.max(16,Math.min(26,W*.045));ctx.font='bold '+f+'px system-ui,Arial';
  const top=Math.max(10,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--st'))||10);
  ctx.fillText('ניקוד: '+Math.floor(S.score),W-14,top);ctx.fillText('ראיות: '+S.ev,W-14,top+f*1.3);ctx.fillText('🏆 '+Math.max(best,Math.floor(S.score)),W-14,top+f*2.6);
  ctx.textAlign='left';ctx.fillText('❤️'.repeat(Math.max(0,S.hearts)),14,top);
  const bw=Math.min(W*.4,220),bx=14,by=top+f*1.5;ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(bx,by,bw,12);
  const fr=1-Math.min(1,S.gap/34);ctx.fillStyle=fr>.6?'#7CFC9a':fr>.3?'#ffd54a':'#ff6b6b';ctx.fillRect(bx,by,bw*fr,12);
  ctx.font='12px system-ui';ctx.fillStyle='#fff';ctx.fillText('קרבה לחשוד',bx,by+16);checklist(bx,by+34);
  ctx.textAlign='center';ctx.font='bold '+Math.floor(f*1.1)+'px system-ui,Arial';
  for(const p of S.pop){ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.fillText(p.t,W/2,p.y)}ctx.globalAlpha=1;
  if(S.flash>0){ctx.fillStyle='rgba(255,0,0,'+S.flash+')';ctx.fillRect(0,0,W,H)}
}
function loop(t){if(!running)return;const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);if(running)draw();requestAnimationFrame(loop)}
function start(){initAudio();nextT=0;step=0;reset();ov.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('go').onclick=start;
bestEl.textContent=best?'שיא: '+best:'';
let tx=null,ty=0,done=0;
addEventListener('touchstart',e=>{if(!running)return;const t=e.touches[0];tx=t.clientX;ty=t.clientY;done=0;e.preventDefault()},{passive:false});
addEventListener('touchmove',e=>{if(!running)return;e.preventDefault();if(tx==null||done)return;const t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;done=1;if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else dy<0?jump():dive()},{passive:false});
addEventListener('touchend',e=>{if(running){if(tx!=null&&!done)jump();e.preventDefault()}tx=null},{passive:false});
addEventListener('touchcancel',()=>{tx=null});
addEventListener('keydown',e=>{if(!running){if(e.key==='Enter')start();return}
  const k=e.key;if(k==='ArrowLeft'||k==='a')mv(-1);else if(k==='ArrowRight'||k==='d')mv(1);else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')dive();
  if(k.startsWith('Arrow')||k===' ')e.preventDefault()});
const nm=document.getElementById('nm'),sh=document.getElementById('sh'),bd=document.getElementById('board');
let board=[],lastScore=best;
try{board=JSON.parse(localStorage.getItem('mpboard')||'[]');nm.value=localStorage.getItem('mpname')||''}catch(e){}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function addScore(v){const d=Date.now(),n=(nm.value||'').trim().slice(0,12)||'שוטר';board.push({n,s:v,d});board.sort((a,b)=>b.s-a.s||a.d-b.d);board=board.slice(0,10);
  try{localStorage.setItem('mpboard',JSON.stringify(board));localStorage.setItem('mpname',(nm.value||'').trim())}catch(e){}return board.findIndex(r=>r.d===d)}
function showBoard(hl){bd.innerHTML=board.length?'<div style="margin-top:10px;font-weight:700">🏆 טבלת שיאים</div><table style="margin:6px auto;border-collapse:collapse;font-size:15px">'+board.map((r,i)=>'<tr style="'+(i===hl?'background:rgba(255,213,74,.28);':'')+'"><td style="padding:2px 8px">'+(['🥇','🥈','🥉'][i]||(i+1))+'</td><td style="padding:2px 10px;text-align:right">'+esc(r.n)+'</td><td style="padding:2px 8px;font-weight:700">'+r.s+'</td></tr>').join('')+'</table>':'';
  sh.classList.toggle('hide',!(lastScore||best))}
function waShare(t){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function shareScore(){const sc=lastScore||best,txt='🚓 קיבלתי '+sc+' נקודות במרדף משטרה צבאית! תצליחו לשבור את השיא שלי?',url=location.href,full=txt+' '+url;
  const fb=()=>{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(full).then(()=>{sh.textContent='✔ הועתק! הדבק לחברים';setTimeout(()=>sh.textContent='📤 שתף את השיא',2500)},()=>waShare(full));else waShare(full)};
  if(navigator.share)navigator.share({title:'מרדף משטרה צבאית',text:txt,url}).catch(e=>{if(!e||e.name!=='AbortError')fb()});else fb()}
sh.onclick=shareScore;showBoard(-1);
const mb=document.getElementById('mute');
function setMute(m){muted=m;mb.textContent=m?'🔇':'🔊';try{localStorage.setItem('mpmute',m?'1':'0')}catch(e){}if(master)master.gain.value=m?0:.7}
['touchstart','touchmove','touchend'].forEach(n=>mb.addEventListener(n,e=>e.stopPropagation(),{passive:true}));
mb.onclick=()=>{initAudio();setMute(!muted)};mb.textContent=muted?'🔇':'🔊';
reset();draw();
</script>
